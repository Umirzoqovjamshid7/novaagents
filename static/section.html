<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Engineering</title><style>body{margin:0;background:#080f18;color:#edf4ff;font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#09121e;border-right:1px solid #26364d;padding:20px 12px}.brand{font-size:22px;font-weight:800;padding:0 12px 20px}.brand i{display:inline-block;width:29px;height:29px;border-radius:9px;background:linear-gradient(140deg,#fff 0 20%,#765cff 21% 54%,#25cf93 55%);vertical-align:middle;margin-right:9px;transform:rotate(-20deg)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:10px;text-align:left;padding:11px 12px;color:#abb9cd}.nav button:hover,.nav button.active{background:#19283d;color:#fff}.nav span{display:inline-block;width:25px}.badge{float:right;background:#293a51;border-radius:14px;padding:2px 8px;font-size:11px}.side-note{margin-top:40px;border:1px solid #283950;border-radius:11px;padding:12px;color:#92a2b8;font-size:12px}.ok{color:#5de3a5}.main{min-width:0}.top{height:66px;border-bottom:1px solid #283950;display:flex;align-items:center;padding:0 25px}.top h1{margin:0;font-size:20px}.top-right{margin-left:auto;color:#92a2b8}.avatar{display:inline-grid;place-items:center;background:#1386c3;width:34px;height:34px;border-radius:50%;margin-left:14px;color:#fff}.content{padding:23px 25px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:19px}.head h2{font-size:26px;margin:2px 0 5px}.muted{color:#92a2b8}.btn{background:#152438;border:1px solid #2c405b;border-radius:9px;padding:10px 14px;color:#fff}.primary{background:linear-gradient(135deg,#725aff,#6749ed);border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(180deg,#0f1b2a,#0c1622);border:1px solid #283950;border-radius:11px;padding:16px}.card h3{margin:0 0 12px;font-size:15px}.wide{grid-column:1/-1}.stat{font-size:28px;font-weight:800;color:#73c2ff}.green{color:#64e6ad}.orange{color:#ffc27f}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #1c2c40}.table th{color:#92a2b8;font-size:12px}.table tr:hover td{background:#122136}.pill{display:inline-block;padding:5px 9px;border-radius:16px;background:#233248;font-size:12px}.pill.green{background:#103d32}.pill.orange{background:#493b23}.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #1c2c40}.row:last-child{border:0}.row .grow{flex:1}.icon{width:34px;height:34px;border-radius:10px;background:#345dff;display:grid;place-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#28d58c;display:inline-block}.dot.off{background:#8392a8}.filter{display:flex;gap:8px;margin-bottom:12px}.filter input,.filter select{background:#0a1420;color:#fff;border:1px solid #2c405b;border-radius:8px;padding:10px}.empty{text-align:center;color:#92a2b8;padding:35px}.code{background:#08131f;padding:14px;border-radius:8px;color:#a9c0da;font:12px Consolas,monospace}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#1b2d44;border:1px solid #48617f;border-radius:9px;padding:12px}.toast.show{display:block}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.shell{grid-template-columns:1fr}.side{display:none}.content{padding:14px}.grid{grid-template-columns:1fr}.head{align-items:start;gap:12px;flex-direction:column}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><i></i>NOVA</div><nav class="nav"><button data-r="dashboard">⌂ <span>Dashboard</span></button><button data-r="workspace">▣ <span>Workspace</span></button><button data-r="projects">▱ <span>Projects</span></button><button data-r="tasks">✓ <span>Tasks</span></button><button data-r="agents">♧ <span>Agents</span></button><button data-r="workflows">♧ <span>Workflows</span><b class="badge">n8n</b></button><button data-r="servers">▤ <span>Servers</span></button><button data-r="activity">◷ <span>Activity</span></button><button data-r="notifications">♢ <span>Notifications</span></button><button data-r="settings">⚙ <span>Settings</span></button></nav><div class="side-note">Backend<br><span class="ok">● Connected</span><br><br>Current page<br><span id="pageState">Loading</span></div></aside><main class="main"><header class="top"><h1>NOVA Engineering</h1><div class="top-right"><span class="ok">● Running</span><span class="avatar">U</span></div></header><section class="content"><div class="head"><div><div class="muted">Engineering control center</div><h2 id="pageTitle">Loading...</h2><div class="muted" id="pageDescription"></div></div><div id="headActions"></div></div><div id="page"></div></section></main></div><div id="toast" class="toast"></div><script>
const $=x=>document.getElementById(x),path=location.pathname.replace('/','')||'dashboard';function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(u,o={}){let r=await fetch(u,o);if(!r.ok)throw Error((await r.text()).slice(0,300));return r.json()}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function nav(){document.querySelectorAll('[data-r]').forEach(b=>{if(b.dataset.r===path)b.classList.add('active');b.onclick=()=>location.href=b.dataset.r==='workspace'?'/':'/'+b.dataset.r})}function header(t,d,a=''){ $('pageTitle').textContent=t;$('pageDescription').textContent=d;$('headActions').innerHTML=a;$('pageState').textContent=path}
async function projects(){let p=await api('/api/projects');header('Projects','Loyihalar, workspace path va health check','<button class="btn primary" id="healthAll">⌁ Check Health</button>');$('page').innerHTML=`<div class="grid"><div class="card"><h3>Total projects</h3><div class="stat">${p.projects.length}</div></div><div class="card"><h3>Workspace policy</h3><div class="muted">Faqat configured workspace child folderlar</div></div><div class="card"><h3>Available agents</h3><div class="stat">${Object.keys(p.agents).length}</div></div><div class="card wide"><h3>Project list</h3><table class="table"><thead><tr><th>Name</th><th>Tests</th><th>Action</th></tr></thead><tbody>${p.projects.map(x=>`<tr><td><b>${safe(x)}</b></td><td id="h-${safe(x)}">Not checked</td><td><button class="btn" data-health="${safe(x)}">Check</button></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-health]').forEach(b=>b.onclick=async()=>{try{let h=await api('/api/projects/'+encodeURIComponent(b.dataset.health)+'/health');$('h-'+b.dataset.health).innerHTML=`<span class="pill ${h.tests_detected?'green':'orange'}">${h.tests_detected?'Tests found':'No tests'}</span>`}catch(e){toast(e.message)}});$('healthAll').onclick=()=>document.querySelectorAll('[data-health]').forEach(b=>b.click())}
async function tasks(){let a=await api('/api/tasks');header('Tasks','Task management, filtering va actionlar','<button class="btn primary" id="newTask">＋ New Task</button>');$('page').innerHTML=`<div class="card"><div class="filter"><input id="q" placeholder="Search task, project, agent..."><select id="f"><option value="">All statuses</option><option>queued</option><option>running</option><option>completed</option><option>failed</option><option>awaiting_approval</option><option>cancelled</option></select></div><table class="table"><thead><tr><th>Task ID</th><th>Project</th><th>Agent</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>`;function draw(){let q=$('q').value.toLowerCase(),f=$('f').value,l=a.filter(t=>(!f||t.status===f)&&(!q||JSON.stringify(t).toLowerCase().includes(q)));$('rows').innerHTML=l.length?l.map(t=>`<tr><td>${safe(t.id)}</td><td>${safe(t.project)}</td><td>${safe(t.agent)}</td><td><span class="pill">${safe(t.status)}</span></td><td>${new Date(t.created*1000).toLocaleString()}</td><td><button class="btn" data-open="${t.id}">Open</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Task topilmadi</td></tr>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.href='/?task='+b.dataset.open)}draw();$('q').oninput=draw;$('f').onchange=draw;$('newTask').onclick=()=>location.href='/' }
async function agents(){let d=await api('/api/dashboard');header('Agents','Status, capability, handoff va retry policy');$('page').innerHTML='<div class="grid">'+d.agents.map(a=>`<div class="card"><div class="row"><span class="icon">♧</span><div class="grow"><h3>${safe(a.name)}</h3><div class="muted">${safe(a.label)}</div></div><span class="dot ${a.status==='idle'?'off':''}"></span></div><div class="row"><span>Current status</span><b>${safe(a.status)}</b></div><div class="row"><span>Handoff</span><span class="muted">Coding → Testing → Debug</span></div><div class="row"><span>Retry limit</span><span>2</span></div></div>`).join('')+'</div>'}
async function workflows(){let d=await api('/api/dashboard');header('n8n Workflows','Connection health, workflow contract va trigger oqimi','<button class="btn" id="refresh">↻ Refresh</button>');$('page').innerHTML=`<div class="grid"><div class="card"><h3>Connection</h3><div class="stat ${d.n8n.configured?'green':'orange'}">${d.n8n.status}</div><p class="muted">N8N_BASE_URL configuration</p></div><div class="card"><h3>Task submission</h3><div class="code">POST /api/tasks · Header: X-Agent-Key</div></div><div class="card"><h3>Completion notification</h3><span class="pill orange">Data Store dedup required</span></div><div class="card wide"><h3>Workflow design</h3><div class="code">Webhook → HTTP Request → Task ID → Poll /api/tasks/:id → Telegram notification</div></div></div>`;$('refresh').onclick=()=>location.reload()}
async function servers(){let d=await api('/api/dashboard'),w=d.workers[0];header('Servers & Workers','Connectivity, Codex availability va safety','<button class="btn" id="refresh">↻ Refresh</button>');$('page').innerHTML=`<div class="grid"><div class="card"><h3>Local worker</h3><div class="stat ${w.status==='online'?'green':'red'}">${w.status}</div><p>${safe(w.name)}</p></div><div class="card"><h3>Codex CLI</h3><div class="stat ${w.codex_available?'green':'orange'}">${w.codex_available?'Ready':'Missing'}</div></div><div class="card"><h3>Current tasks</h3><div class="stat">${w.current_tasks}</div></div><div class="card wide"><h3>Worker safety</h3><div class="row"><span>Workspace restriction</span><b class="ok">Enabled</b></div><div class="row"><span>Remote shell</span><span class="pill orange">Not exposed</span></div><div class="row"><span>Heartbeat</span><span class="muted">In-process worker</span></div></div></div>`;$('refresh').onclick=()=>location.reload()}
async function activity(){let d=await api('/api/dashboard');header('Activity & Logs','Structured event timeline va search');$('page').innerHTML='<div class="card"><div class="filter"><input id="q" placeholder="Search activity..."></div><div id="rows"></div></div>';function draw(){let q=$('q').value.toLowerCase(),x=d.activity.filter(a=>!q||JSON.stringify(a).toLowerCase().includes(q));$('rows').innerHTML=x.length?x.map(a=>`<div class="row"><span class="dot"></span><div class="grow"><b>${safe(a.role)} · ${safe(a.project||'')}</b><div class="muted">${safe(a.detail)}</div></div><small class="muted">${new Date(a.at*1000).toLocaleString()}</small></div>`).join(''):'<div class="empty">Activity topilmadi</div>'}draw();$('q').oninput=draw}
async function notifications(){let d=await api('/api/dashboard');header('Notifications','Telegram, n8n va delivery policy');$('page').innerHTML=`<div class="grid"><div class="card"><h3>Telegram</h3><div class="stat orange">Adapter</div><p class="muted">Long polling alohida process.</p></div><div class="card"><h3>n8n</h3><div class="stat ${d.n8n.configured?'green':'orange'}">${d.n8n.status}</div><p class="muted">Completion notification workflow orqali.</p></div><div class="card"><h3>Email / Slack</h3><div class="stat orange">Not configured</div></div><div class="card wide"><h3>Delivery policy</h3><div class="row"><span>Duplicate protection</span><b class="ok">Event ID / Data Store</b></div><div class="row"><span>Task state</span><span>Notification xatosi task execution’ni buzmaydi</span></div></div></div>`}
async function settings(){let m=await api('/api/metrics');header('Settings','Task policies, authentication va safe configuration');$('page').innerHTML=`<div class="grid"><div class="card"><h3>Task policy</h3><div class="row"><span>Queue limit</span><b>${m.queue_limit}</b></div><div class="row"><span>Worker mode</span><b>Serial</b></div><div class="row"><span>Cancellation</span><b class="ok">Process-tree stop</b></div></div><div class="card"><h3>Security</h3><div class="row"><span>Auth</span><b>Basic / API key</b></div><div class="row"><span>Secret logs</span><b class="ok">Masked</b></div><div class="row"><span>Project access</span><b class="ok">Workspace restricted</b></div></div><div class="card"><h3>AI Provider</h3><div class="stat">Codex CLI</div><p class="muted">Environment orqali boshqariladi.</p></div><div class="card wide"><h3>Safe configuration</h3><div class="code">ADMIN_PASSWORD = masked · AGENT_API_KEY = masked · AGENT_MAX_QUEUE_SIZE = ${m.queue_limit}</div></div></div>`}
async function render(){try{if(path==='projects')await projects();else if(path==='tasks')await tasks();else if(path==='agents')await agents();else if(path==='workflows')await workflows();else if(path==='servers')await servers();else if(path==='activity')await activity();else if(path==='notifications')await notifications();else if(path==='settings')await settings();else location.href='/dashboard'}catch(e){$('page').innerHTML='<div class="card empty">'+safe(e.message)+'</div>'}}nav();render();
</script></body></html>
